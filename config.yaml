# ── Sources ───────────────────────────────────────────────────────────────────
# Names must match entries in the SOURCES registry (edgedash/sources/base.py).
sources:
  - arbeitnow
  - apify        # requires APIFY_TOKEN in .env (see .env.example)

# Set to true to use the offline MockFetcher instead of live sources.
# Useful for local development when you don't want network calls.
use_mock_fetcher: false

# ── Storage ───────────────────────────────────────────────────────────────────
# Relative path from the repo root. Week-4 migration: replace with a
# DATABASE_URL env var loaded in settings and remove this field.
db_path: "edgedash.db"
